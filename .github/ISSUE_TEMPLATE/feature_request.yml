name: Feature request
description: Suggest an improvement to minji.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The practice workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like minji to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
