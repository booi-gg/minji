<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runner bench</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 960px;
        padding: 16px;
        font-size: 1rem;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
      }
      h2 {
        font-size: 1.375rem;
        line-height: 1.3;
      }
      textarea,
      input {
        font:
          14px ui-monospace,
          monospace;
        width: 100%;
        box-sizing: border-box;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        padding: 4px 8px;
        text-align: left;
      }
      td.number {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .row {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0;
      }
      #heartbeat {
        font-variant-numeric: tabular-nums;
      }
      pre {
        overflow-x: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Runner bench</h1>
    <p>
      Throwaway page for step 0. Open it on a phone with <code>vp dev --host</code> and visit
      <code>/src/runner/bench/</code>. The heartbeat counter should keep moving while code runs.
    </p>
    <p class="row">Heartbeat: <span id="heartbeat">0</span> · max gap <span id="gap">0</span> ms</p>

    <h2>Benchmarks</h2>
    <div class="row"><button id="bench" type="button">Run benchmarks</button></div>
    <table>
      <thead>
        <tr>
          <th scope="col">Case</th>
          <th scope="col">Result</th>
          <th scope="col">Call ms</th>
          <th scope="col">Run ms</th>
        </tr>
      </thead>
      <tbody id="bench-rows"></tbody>
    </table>

    <h2>Try code</h2>
    <label for="source">Source (JavaScript or TypeScript)</label>
    <textarea id="source" rows="10"></textarea>
    <div class="row">
      <label for="function-name">Function</label>
      <input id="function-name" value="spin" style="width: 12em" />
      <label for="args">Args JSON</label>
      <input id="args" value="[]" style="width: 16em" />
      <label for="language">Language</label>
      <select id="language">
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
      </select>
    </div>
    <div class="row">
      <button id="run" type="button">Run</button>
      <button id="stop" type="button">Stop</button>
    </div>
    <pre id="output" aria-live="polite"></pre>
    <script type="module" src="./bench.ts"></script>
  </body>
</html>
